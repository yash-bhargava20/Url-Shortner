services:
  backend:
    build: ./backend
    container_name: url-backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/urlshortener
      REDIS_URL: redis://redis:6379
      JWT_SECRET: supersecretjwtkey
      CLIENT_URL: http://localhost:4173
      REDIRECT_URL: http://localhost:5000
    depends_on:
      - mongo
      - redis

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5000/api
        VITE_REDIRECT_URL: http://localhost:5000
    container_name: url-frontend
    ports:
      - "4173:4173"
    depends_on:
      - backend

  mongo:
    image: mongo:latest
    container_name: url-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:alpine
    container_name: url-redis
    ports:
      - "6379:6379"

volumes:
  mongo-data:
